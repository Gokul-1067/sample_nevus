<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="eqSw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B33"/>
      <stop offset="100%" stop-color="#060C18"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#eqSw)"/>

  <!-- Enterprise Network Switch & Router -->
  <g transform="translate(250, 160)">
    <!-- 48-Port Managed Switch -->
    <rect x="-210" y="-85" width="420" height="75" rx="6" fill="#0C172B" stroke="#00E5BE" stroke-width="1.8"/>
    <!-- Rack Ears -->
    <rect x="-225" y="-80" width="15" height="65" rx="2" fill="#334155"/>
    <circle cx="-218" cy="-60" r="3" fill="#0B132B"/><circle cx="-218" cy="-35" r="3" fill="#0B132B"/>
    <rect x="210" y="-80" width="15" height="65" rx="2" fill="#334155"/>
    <circle cx="218" cy="-60" r="3" fill="#0B132B"/><circle cx="218" cy="-35" r="3" fill="#0B132B"/>

    <!-- Switch Faceplate -->
    <rect x="-195" y="-72" width="60" height="50" rx="3" fill="#060C17"/>
    <text x="-165" y="-52" fill="#00E5BE" font-family="monospace" font-size="8" text-anchor="middle">L3 GIGABIT</text>
    <text x="-165" y="-38" fill="#388BFD" font-family="monospace" font-size="7" text-anchor="middle">POE+ 740W</text>

    <!-- RJ45 Port Matrix -->
    <g fill="#10243E" stroke="#1E3A6B">
      <!-- Upper row of ports -->
      <rect x="-120" y="-72" width="16" height="20" rx="2"/><rect x="-98" y="-72" width="16" height="20" rx="2"/>
      <rect x="-76" y="-72" width="16" height="20" rx="2"/><rect x="-54" y="-72" width="16" height="20" rx="2"/>
      <rect x="-32" y="-72" width="16" height="20" rx="2"/><rect x="-10" y="-72" width="16" height="20" rx="2"/>
      <rect x="12" y="-72" width="16" height="20" rx="2"/><rect x="34" y="-72" width="16" height="20" rx="2"/>
      <rect x="56" y="-72" width="16" height="20" rx="2"/><rect x="78" y="-72" width="16" height="20" rx="2"/>
      <rect x="100" y="-72" width="16" height="20" rx="2"/><rect x="122" y="-72" width="16" height="20" rx="2"/>

      <!-- Lower row of ports -->
      <rect x="-120" y="-46" width="16" height="20" rx="2"/><rect x="-98" y="-46" width="16" height="20" rx="2"/>
      <rect x="-76" y="-46" width="16" height="20" rx="2"/><rect x="-54" y="-46" width="20" height="20" rx="2"/>
      <rect x="-32" y="-46" width="16" height="20" rx="2"/><rect x="-10" y="-46" width="16" height="20" rx="2"/>
      <rect x="12" y="-46" width="16" height="20" rx="2"/><rect x="34" y="-46" width="16" height="20" rx="2"/>
      <rect x="56" y="-46" width="16" height="20" rx="2"/><rect x="78" y="-46" width="16" height="20" rx="2"/>
      <rect x="100" y="-46" width="16" height="20" rx="2"/><rect x="122" y="-46" width="16" height="20" rx="2"/>
    </g>

    <!-- Fiber SFP+ 10G Uplink cages -->
    <rect x="150" y="-70" width="20" height="42" rx="2" fill="#060C17" stroke="#388BFD"/>
    <rect x="175" y="-70" width="20" height="42" rx="2" fill="#060C17" stroke="#388BFD"/>
    <circle cx="160" cy="-49" r="3" fill="#00E5BE"/>
    <circle cx="185" cy="-49" r="3" fill="#00E5BE"/>

    <!-- Enterprise Router Below -->
    <rect x="-180" y="15" width="360" height="65" rx="6" fill="#0C172B" stroke="#388BFD" stroke-width="1.5"/>
    <rect x="-160" y="27" width="80" height="40" rx="3" fill="#060C17"/>
    <text x="-120" y="51" fill="#388BFD" font-family="monospace" font-size="8.5" text-anchor="middle">ROUTER / NAT</text>
    <!-- WAN / LAN ports -->
    <g fill="#10243E" stroke="#1E3A6B">
      <rect x="-60" y="32" width="22" height="28" rx="2"/>
      <rect x="-30" y="32" width="22" height="28" rx="2"/>
      <rect x="0" y="32" width="22" height="28" rx="2"/>
      <rect x="30" y="32" width="22" height="28" rx="2"/>
      <rect x="60" y="32" width="22" height="28" rx="2"/>
    </g>
    <!-- Router status -->
    <circle cx="120" cy="46" r="4" fill="#00E5BE"/>
    <circle cx="135" cy="46" r="4" fill="#388BFD"/>
    <text x="145" y="49" fill="#94A3B8" font-family="monospace" font-size="7.5">VLAN READY</text>

    <text x="0" y="105" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Network Switches, Routers &amp; Hubs</text>
    <text x="0" y="120" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" text-anchor="middle">Managed PoE+ • Layer 3 Routing • SFP+ Fiber Uplinks</text>
  </g>

  <!-- Spec Tag -->
  <rect x="20" y="20" width="145" height="24" rx="12" fill="#1E3A8A" fill-opacity="0.4" stroke="#388BFD" stroke-width="1"/>
  <text x="92" y="36" fill="#93C5FD" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">SWITCHING &amp; ROUTING</text>
</svg>

