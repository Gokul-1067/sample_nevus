<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="eqRack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B33"/>
      <stop offset="100%" stop-color="#060C18"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#eqRack)"/>

  <!-- Left: Wall-Mount 9U/12U Enclosure -->
  <g transform="translate(150, 165)">
    <rect x="-70" y="-85" width="140" height="170" rx="6" fill="#0C172B" stroke="#00E5BE" stroke-width="1.8"/>
    <!-- Glass Door Window with Tint -->
    <rect x="-58" y="-72" width="116" height="144" rx="4" fill="#060F1E" stroke="#1E3258"/>
    <!-- Inside components -->
    <rect x="-50" y="-62" width="100" height="18" rx="2" fill="#13233D" stroke="#388BFD"/>
    <rect x="-50" y="-38" width="100" height="24" rx="2" fill="#13233D" stroke="#00E5BE"/>
    <rect x="-50" y="-8" width="100" height="18" rx="2" fill="#13233D"/>
    <rect x="-50" y="16" width="100" height="40" rx="2" fill="#111D30" stroke="#475569"/>
    <!-- Key Lock -->
    <circle cx="48" cy="0" r="4" fill="#64748B"/>
    <text x="0" y="105" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Wall-Mount Enclosure</text>
    <text x="0" y="120" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">6U / 9U / 12U Network Box</text>
  </g>

  <!-- Right: Floor Standing 42U Server Rack -->
  <g transform="translate(360, 165)">
    <rect x="-75" y="-115" width="150" height="230" rx="6" fill="#0C172B" stroke="#388BFD" stroke-width="1.8"/>
    <!-- Perforated Door -->
    <rect x="-65" y="-105" width="130" height="210" rx="4" fill="#070E1A" stroke="#1E293B"/>
    
    <!-- Rack Rails and Units -->
    <g fill="#12223C" stroke="#1E3A6B">
      <rect x="-55" y="-95" width="110" height="16" rx="2"/>
      <rect x="-55" y="-74" width="110" height="24" rx="2" stroke="#00E5BE"/>
      <rect x="-55" y="-45" width="110" height="24" rx="2" stroke="#388BFD"/>
      <rect x="-55" y="-16" width="110" height="24" rx="2"/>
      <rect x="-55" y="13" width="110" height="20" rx="2"/>
      <rect x="-55" y="38" width="110" height="36" rx="2" stroke="#475569"/>
    </g>
    <!-- Server LED flashes -->
    <circle cx="-45" cy="-62" r="2.5" fill="#00E5BE"/>
    <circle cx="-45" cy="-33" r="2.5" fill="#388BFD"/>

    <!-- Castors & Levelling Feet -->
    <rect x="-65" y="117" width="18" height="6" rx="2" fill="#334155"/>
    <rect x="47" y="117" width="18" height="6" rx="2" fill="#334155"/>

    <text x="0" y="136" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Floor Server Rack (24U–42U)</text>
  </g>

  <!-- Spec Tag -->
  <rect x="20" y="20" width="145" height="24" rx="12" fill="#1E3A8A" fill-opacity="0.4" stroke="#388BFD" stroke-width="1"/>
  <text x="92" y="36" fill="#93C5FD" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">EQUIPMENT ENCLOSURES</text>
</svg>

