<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="eqRackLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#eqRackLight)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Left: Wall-Mount 9U/12U Enclosure -->
  <g transform="translate(150, 165)">
    <rect x="-70" y="-85" width="140" height="170" rx="6" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.8"/>
    <!-- Glass Door Window with Tint -->
    <rect x="-58" y="-72" width="116" height="144" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <!-- Inside components -->
    <rect x="-50" y="-62" width="100" height="18" rx="2" fill="#EFF6FF" stroke="#1D5BD8"/>
    <rect x="-50" y="-38" width="100" height="24" rx="2" fill="#F1F5F9" stroke="#93C5FD"/>
    <rect x="-50" y="-8" width="100" height="18" rx="2" fill="#F1F5F9"/>
    <rect x="-50" y="16" width="100" height="40" rx="2" fill="#FFFFFF" stroke="#CBD5E1"/>
    <!-- Key Lock -->
    <circle cx="48" cy="0" r="4" fill="#64748B"/>
    <text x="0" y="105" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Wall-Mount Enclosure</text>
    <text x="0" y="120" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">6U / 9U / 12U Network Box</text>
  </g>

  <!-- Right: Floor Standing 42U Server Rack -->
  <g transform="translate(360, 165)">
    <rect x="-75" y="-115" width="150" height="230" rx="6" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.8"/>
    <!-- Perforated Door -->
    <rect x="-65" y="-105" width="130" height="210" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    
    <!-- Rack Rails and Units -->
    <g fill="#F1F5F9" stroke="#CBD5E1">
      <rect x="-55" y="-95" width="110" height="16" rx="2"/>
      <rect x="-55" y="-74" width="110" height="24" rx="2" stroke="#1D5BD8"/>
      <rect x="-55" y="-45" width="110" height="24" rx="2" stroke="#0F766E"/>
      <rect x="-55" y="-16" width="110" height="24" rx="2"/>
      <rect x="-55" y="13" width="110" height="20" rx="2"/>
      <rect x="-55" y="38" width="110" height="36" rx="2" stroke="#94A3B8"/>
    </g>
    <!-- Server LED flashes -->
    <circle cx="-45" cy="-62" r="2.5" fill="#059669"/>
    <circle cx="-45" cy="-33" r="2.5" fill="#1D5BD8"/>

    <!-- Castors & Levelling Feet -->
    <rect x="-65" y="117" width="18" height="6" rx="2" fill="#64748B"/>
    <rect x="47" y="117" width="18" height="6" rx="2" fill="#64748B"/>

    <text x="0" y="136" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Floor Server Rack (24U–42U)</text>
  </g>

  <!-- Spec Tag -->
  <rect x="20" y="20" width="155" height="24" rx="12" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="97" y="36" fill="#1D5BD8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">EQUIPMENT ENCLOSURES</text>
</svg>
