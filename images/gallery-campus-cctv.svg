<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none">
  <rect width="600" height="420" rx="12" fill="#0A1426"/>
  <!-- Wall Mount Multi-Display Matrix -->
  <g transform="translate(60, 40)">
    <rect width="480" height="240" rx="6" fill="#040914" stroke="#1E3258" stroke-width="2"/>
    <!-- 6 Screens -->
    <rect x="15" y="15" width="140" height="95" rx="3" fill="#0F1E38" stroke="#00E5BE"/>
    <text x="25" y="32" fill="#00E5BE" font-family="monospace" font-size="8">CAM 01 • CAMPUS GATE</text>
    <rect x="170" y="15" width="140" height="95" rx="3" fill="#0F1E38" stroke="#388BFD"/>
    <text x="180" y="32" fill="#388BFD" font-family="monospace" font-size="8">CAM 02 • QUADRANGLE</text>
    <rect x="325" y="15" width="140" height="95" rx="3" fill="#0F1E38" stroke="#388BFD"/>
    <text x="335" y="32" fill="#388BFD" font-family="monospace" font-size="8">CAM 03 • LAB CORRIDOR</text>

    <rect x="15" y="125" width="140" height="95" rx="3" fill="#0F1E38" stroke="#388BFD"/>
    <text x="25" y="142" fill="#388BFD" font-family="monospace" font-size="8">CAM 04 • AUDITORIUM</text>
    <rect x="170" y="125" width="140" height="95" rx="3" fill="#0F1E38" stroke="#00E5BE"/>
    <text x="180" y="142" fill="#00E5BE" font-family="monospace" font-size="8">CAM 05 • SERVER ROOM</text>
    <rect x="325" y="125" width="140" height="95" rx="3" fill="#0F1E38" stroke="#388BFD"/>
    <text x="335" y="142" fill="#388BFD" font-family="monospace" font-size="8">CAM 06 • PARKING</text>
  </g>
  <!-- Operator Console Desk -->
  <g transform="translate(100, 310)">
    <rect width="400" height="50" rx="4" fill="#13233D" stroke="#1E3A6B"/>
    <rect x="150" y="-15" width="100" height="20" rx="2" fill="#0B1528" stroke="#388BFD"/>
    <text x="200" y="-1" fill="#93C5FD" font-family="monospace" font-size="8" text-anchor="middle">LIVE CONTROL DECK</text>
  </g>
  <rect x="30" y="375" width="540" height="30" rx="6" fill="#0F1E34"/>
  <text x="45" y="394" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Centralized Campus Video Surveillance Operations</text>
  <text x="555" y="394" fill="#00E5BE" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="end">Educational Institution Deployment</text>
</svg>

