<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="eqEpabx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B33"/>
      <stop offset="100%" stop-color="#060C18"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#eqEpabx)"/>

  <!-- Center PBX Server & Desk Phone -->
  <g transform="translate(160, 165)">
    <!-- IP-PBX Hybrid Unit -->
    <rect x="-85" y="-85" width="170" height="170" rx="8" fill="#0C172B" stroke="#00E5BE" stroke-width="1.8"/>
    <rect x="-75" y="-72" width="150" height="26" rx="3" fill="#060C17"/>
    <circle cx="-55" cy="-59" r="3" fill="#00E5BE"/>
    <text x="50" y="-56" fill="#00E5BE" font-family="monospace" font-size="8" text-anchor="end">HYBRID IP-PBX</text>
    
    <!-- Expansion Cards -->
    <rect x="-75" y="-36" width="150" height="22" rx="2" fill="#13233D" stroke="#1E3A6B"/>
    <text x="-65" y="-22" fill="#E2E8F0" font-family="monospace" font-size="7.5">FXO TRUNKS (CO LINES)</text>
    <rect x="-75" y="-8" width="150" height="22" rx="2" fill="#13233D" stroke="#1E3A6B"/>
    <text x="-65" y="6" fill="#E2E8F0" font-family="monospace" font-size="7.5">ANALOG EXTENSIONS (FXS)</text>
    <rect x="-75" y="20" width="150" height="22" rx="2" fill="#13233D" stroke="#1E3A6B"/>
    <text x="-65" y="34" fill="#00E5BE" font-family="monospace" font-size="7.5">SIP TRUNK / VOIP SERVER</text>
    <rect x="-75" y="48" width="150" height="22" rx="2" fill="#13233D" stroke="#1E3A6B"/>
    <text x="-65" y="62" fill="#388BFD" font-family="monospace" font-size="7.5">AUTO ATTENDANT / IVR</text>

    <text x="0" y="104" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Modular EPABX / IP-PBX Core</text>
  </g>

  <!-- Right: Digital Key Phone & Handset -->
  <g transform="translate(365, 165)">
    <path d="M-65 -45 L65 -45 L80 65 L-80 65 Z" fill="#0C172B" stroke="#388BFD" stroke-width="1.8"/>
    <!-- Screen -->
    <rect x="-50" y="-35" width="60" height="36" rx="3" fill="#050C17" stroke="#00E5BE"/>
    <text x="-44" y="-22" fill="#00E5BE" font-family="monospace" font-size="7">EXT: 200</text>
    <text x="-44" y="-10" fill="#93C5FD" font-family="monospace" font-size="6">CALL ACTIVE</text>
    <!-- DSS Console Keys -->
    <g fill="#1F3458">
      <rect x="18" y="-35" width="45" height="10" rx="1"/>
      <rect x="18" y="-22" width="45" height="10" rx="1"/>
      <rect x="18" y="-9" width="45" height="10" rx="1"/>
      <rect x="18" y="4" width="45" height="10" rx="1"/>
    </g>
    <!-- Keypad -->
    <g fill="#142644">
      <rect x="-50" y="8" width="18" height="12" rx="1"/><rect x="-28" y="8" width="18" height="12" rx="1"/><rect x="-6" y="8" width="18" height="12" rx="1"/>
      <rect x="-50" y="24" width="18" height="12" rx="1"/><rect x="-28" y="24" width="18" height="12" rx="1"/><rect x="-6" y="24" width="18" height="12" rx="1"/>
      <rect x="-50" y="40" width="18" height="12" rx="1"/><rect x="-28" y="40" width="18" height="12" rx="1"/><rect x="-6" y="40" width="18" height="12" rx="1"/>
    </g>
    <!-- Handset Contour -->
    <path d="M-82 -25 C-72 -50, -72 50, -82 75" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="104" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Digital Console Key Telephone</text>
  </g>

  <!-- Spec Tag -->
  <rect x="20" y="20" width="135" height="24" rx="12" fill="#1E3A8A" fill-opacity="0.4" stroke="#388BFD" stroke-width="1"/>
  <text x="87" y="36" fill="#93C5FD" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">EPABX &amp; TELEPHONY</text>
</svg>

