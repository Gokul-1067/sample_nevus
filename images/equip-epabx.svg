<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="eqEpabxLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#eqEpabxLight)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Center PBX Server & Desk Phone -->
  <g transform="translate(160, 165)">
    <!-- IP-PBX Hybrid Unit -->
    <rect x="-85" y="-85" width="170" height="170" rx="8" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.8"/>
    <rect x="-75" y="-72" width="150" height="26" rx="3" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="-55" cy="-59" r="3" fill="#059669"/>
    <text x="50" y="-56" fill="#1D5BD8" font-family="monospace" font-size="8" font-weight="700" text-anchor="end">HYBRID IP-PBX</text>
    
    <!-- Expansion Cards -->
    <rect x="-75" y="-36" width="150" height="22" rx="2" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="-65" y="-22" fill="#334155" font-family="monospace" font-size="7.5" font-weight="600">FXO TRUNKS (CO LINES)</text>
    <rect x="-75" y="-8" width="150" height="22" rx="2" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="-65" y="6" fill="#334155" font-family="monospace" font-size="7.5" font-weight="600">ANALOG EXTENSIONS (FXS)</text>
    <rect x="-75" y="20" width="150" height="22" rx="2" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="-65" y="34" fill="#1D5BD8" font-family="monospace" font-size="7.5" font-weight="700">SIP TRUNK / VOIP SERVER</text>
    <rect x="-75" y="48" width="150" height="22" rx="2" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="-65" y="62" fill="#0F766E" font-family="monospace" font-size="7.5" font-weight="700">AUTO ATTENDANT / IVR</text>

    <text x="0" y="104" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Modular EPABX / IP-PBX Core</text>
  </g>

  <!-- Right: Digital Key Phone & Handset -->
  <g transform="translate(365, 165)">
    <path d="M-65 -45 L65 -45 L80 65 L-80 65 Z" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.8"/>
    <!-- Screen -->
    <rect x="-50" y="-35" width="60" height="36" rx="3" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="-44" y="-22" fill="#1D5BD8" font-family="monospace" font-size="7" font-weight="700">EXT: 200</text>
    <text x="-44" y="-10" fill="#059669" font-family="monospace" font-size="6" font-weight="700">CALL ACTIVE</text>
    <!-- DSS Console Keys -->
    <g fill="#E2E8F0">
      <rect x="18" y="-35" width="45" height="10" rx="1"/>
      <rect x="18" y="-22" width="45" height="10" rx="1"/>
      <rect x="18" y="-9" width="45" height="10" rx="1"/>
      <rect x="18" y="4" width="45" height="10" rx="1"/>
    </g>
    <!-- Keypad -->
    <g fill="#F1F5F9" stroke="#CBD5E1">
      <rect x="-50" y="8" width="18" height="12" rx="1"/><rect x="-28" y="8" width="18" height="12" rx="1"/><rect x="-6" y="8" width="18" height="12" rx="1"/>
      <rect x="-50" y="24" width="18" height="12" rx="1"/><rect x="-28" y="24" width="18" height="12" rx="1"/><rect x="-6" y="24" width="18" height="12" rx="1"/>
      <rect x="-50" y="40" width="18" height="12" rx="1"/><rect x="-28" y="40" width="18" height="12" rx="1"/><rect x="-6" y="40" width="18" height="12" rx="1"/>
    </g>
    <!-- Handset Contour -->
    <path d="M-82 -25 C-72 -50, -72 50, -82 75" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="104" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Digital Console Key Telephone</text>
  </g>

  <!-- Spec Tag -->
  <rect x="20" y="20" width="145" height="24" rx="12" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="92" y="36" fill="#1D5BD8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">EPABX &amp; TELEPHONY</text>
</svg>
