<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" role="img" aria-label="Nevus Infocom Logo (Light)">
  <defs>
    <linearGradient id="niGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>
  
  <!-- Logo Mark -->
  <g transform="translate(4, 6)">
    <!-- Circuit hex base -->
    <rect x="0" y="0" width="52" height="52" rx="12" fill="#15243B"/>
    <rect x="1" y="1" width="50" height="50" rx="11" stroke="url(#niGradLight)" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Stylized N & I -->
    <rect x="11" y="13" width="5" height="26" rx="2.5" fill="#FFFFFF"/>
    <path d="M14 15.5L28 36.5" stroke="url(#niGradLight)" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="26" y="13" width="5" height="26" rx="2.5" fill="#FFFFFF"/>
    
    <circle cx="39" cy="15" r="2.8" fill="#93C5FD"/>
    <rect x="36.5" y="21" width="5" height="18" rx="2.5" fill="url(#niGradLight)"/>
    
    <circle cx="21" cy="26" r="2" fill="#60A5FA"/>
  </g>
  
  <!-- Company Name & Descriptor -->
  <text x="68" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="21" font-weight="800" letter-spacing="1.5" fill="#FFFFFF">
    NEVUS<tspan fill="#93C5FD">INFOCOM</tspan>
  </text>
  <text x="69" y="47" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.2" fill="#94A3B8">
    SYSTEM INTEGRATION &amp; TECH SOLUTIONS
  </text>
  
  <!-- Sub-indicator 22+ YRS -->
  <rect x="264" y="19" width="50" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.12"/>
  <text x="289" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#93C5FD" text-anchor="middle">
    22+ YRS
  </text>
</svg>

