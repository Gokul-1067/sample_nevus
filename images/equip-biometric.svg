<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="eqBioLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#eqBioLight)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Left: Facial Recognition Terminal -->
  <g transform="translate(160, 160)">
    <rect x="-70" y="-95" width="140" height="190" rx="12" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.8"/>
    <!-- Screen -->
    <rect x="-55" y="-50" width="110" height="120" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <!-- Face Reticle -->
    <circle cx="0" cy="5" r="30" stroke="#1D5BD8" stroke-width="1.5" stroke-dasharray="4 2" fill="none"/>
    <circle cx="-10" cy="0" r="2.5" fill="#1D5BD8"/>
    <circle cx="10" cy="0" r="2.5" fill="#1D5BD8"/>
    <path d="M-6 16 Q0 20 6 16" stroke="#1D5BD8" stroke-width="1.5" fill="none"/>
    <line x1="-25" y1="5" x2="25" y2="5" stroke="#059669" stroke-width="1.5"/>
    <!-- Cameras -->
    <circle cx="-20" cy="-72" r="5" fill="#1E293B" stroke="#CBD5E1"/>
    <circle cx="20" cy="-72" r="5" fill="#1E293B" stroke="#CBD5E1"/>
    <!-- Label -->
    <text x="0" y="88" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Facial Recognition Terminal</text>
  </g>

  <!-- Right: Optical Fingerprint & RFID Device -->
  <g transform="translate(360, 160)">
    <rect x="-65" y="-95" width="130" height="190" rx="12" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.8"/>
    <!-- Small Display -->
    <rect x="-50" y="-80" width="100" height="40" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="0" y="-55" fill="#1D5BD8" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">RFID / PIN READY</text>
    <!-- Keypad matrix -->
    <g fill="#E2E8F0">
      <rect x="-42" y="-30" width="22" height="12" rx="2"/><rect x="-11" y="-30" width="22" height="12" rx="2"/><rect x="20" y="-30" width="22" height="12" rx="2"/>
      <rect x="-42" y="-12" width="22" height="12" rx="2"/><rect x="-11" y="-12" width="22" height="12" rx="2"/><rect x="20" y="-12" width="22" height="12" rx="2"/>
    </g>
    <!-- Fingerprint Scanner Area -->
    <rect x="-35" y="10" width="70" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <g stroke="#1D5BD8" stroke-width="1.5" fill="none">
      <path d="M-18 40 A18 18 0 0 1 18 40"/>
      <path d="M-12 46 A12 12 0 0 1 12 46"/>
      <path d="M-6 52 A6 6 0 0 1 6 52"/>
    </g>
    <!-- Label -->
    <text x="0" y="88" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Biometric Attendance</text>
  </g>

  <!-- Spec Tag -->
  <rect x="20" y="20" width="135" height="24" rx="12" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="87" y="36" fill="#1D5BD8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">BIOMETRIC ACCESS</text>
</svg>
