<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="eqWifi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B33"/>
      <stop offset="100%" stop-color="#060C18"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#eqWifi)"/>

  <!-- Left: Enterprise Ceiling Access Point -->
  <g transform="translate(160, 160)">
    <!-- Circular AP Housing -->
    <ellipse cx="0" cy="0" rx="75" ry="40" fill="#0C172B" stroke="#00E5BE" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="45" ry="24" fill="#060C18" stroke="#1E3258"/>
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#00E5BE" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    
    <!-- Wi-Fi Radiation Arcs -->
    <path d="M-85 -10 C-85 -50, 85 -50, 85 -10" stroke="#00E5BE" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.8"/>
    <path d="M-105 -20 C-105 -70, 105 -70, 105 -20" stroke="#388BFD" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.6"/>

    <text x="0" y="70" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Wi-Fi 6 Enterprise AP</text>
    <text x="0" y="86" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Dual-Band • High-Density Coverage</text>
  </g>

  <!-- Right: Gateway Modem / Industrial Wireless Controller -->
  <g transform="translate(365, 160)">
    <!-- Modem Housing with Antennas -->
    <rect x="-80" y="-30" width="160" height="70" rx="8" fill="#0C172B" stroke="#388BFD" stroke-width="1.8"/>
    
    <!-- Antennas -->
    <line x1="-60" y1="-30" x2="-75" y2="-90" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <line x1="-20" y1="-30" x2="-25" y2="-95" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <line x1="20" y1="-30" x2="25" y2="-95" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="-30" x2="75" y2="-90" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>

    <!-- Front LED status panel -->
    <rect x="-65" y="-15" width="130" height="40" rx="4" fill="#060C17"/>
    <circle cx="-45" cy="5" r="3" fill="#00E5BE"/>
    <circle cx="-30" cy="5" r="3" fill="#00E5BE"/>
    <circle cx="-15" cy="5" r="3" fill="#00E5BE"/>
    <circle cx="0" cy="5" r="3" fill="#00E5BE"/>
    <circle cx="15" cy="5" r="3" fill="#388BFD"/>
    <circle cx="30" cy="5" r="3" fill="#388BFD"/>
    <circle cx="45" cy="5" r="3" fill="#388BFD"/>

    <text x="0" y="70" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Modems &amp; Wireless Controllers</text>
    <text x="0" y="86" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Broadband Gateway • Central Mesh</text>
  </g>

  <!-- Spec Tag -->
  <rect x="20" y="20" width="135" height="24" rx="12" fill="#065F46" fill-opacity="0.4" stroke="#00E5BE" stroke-width="1"/>
  <text x="87" y="36" fill="#6EE7B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">MODEMS &amp; WI-FI</text>
</svg>

