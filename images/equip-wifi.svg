<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="eqWifiLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#eqWifiLight)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Left: Enterprise Ceiling Access Point -->
  <g transform="translate(160, 160)">
    <!-- Circular AP Housing -->
    <ellipse cx="0" cy="0" rx="75" ry="40" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="45" ry="24" fill="#F8FAFC" stroke="#CBD5E1"/>
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#EFF6FF" stroke="#93C5FD"/>
    <circle cx="0" cy="0" r="4" fill="#1D5BD8"/>
    
    <!-- Wi-Fi Radiation Arcs -->
    <path d="M-85 -10 C-85 -50, 85 -50, 85 -10" stroke="#1D5BD8" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.8"/>
    <path d="M-105 -20 C-105 -70, 105 -70, 105 -20" stroke="#0F766E" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.6"/>

    <text x="0" y="70" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Wi-Fi 6 Enterprise AP</text>
    <text x="0" y="86" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Dual-Band • High-Density Coverage</text>
  </g>

  <!-- Right: Gateway Modem / Industrial Wireless Controller -->
  <g transform="translate(365, 160)">
    <!-- Modem Housing with Antennas -->
    <rect x="-80" y="-30" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.8"/>
    
    <!-- Antennas -->
    <line x1="-60" y1="-30" x2="-75" y2="-90" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <line x1="-20" y1="-30" x2="-25" y2="-95" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <line x1="20" y1="-30" x2="25" y2="-95" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="-30" x2="75" y2="-90" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>

    <!-- Front LED status panel -->
    <rect x="-65" y="-15" width="130" height="40" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <circle cx="-45" cy="5" r="3" fill="#059669"/>
    <circle cx="-30" cy="5" r="3" fill="#059669"/>
    <circle cx="-15" cy="5" r="3" fill="#059669"/>
    <circle cx="0" cy="5" r="3" fill="#059669"/>
    <circle cx="15" cy="5" r="3" fill="#1D5BD8"/>
    <circle cx="30" cy="5" r="3" fill="#1D5BD8"/>
    <circle cx="45" cy="5" r="3" fill="#1D5BD8"/>

    <text x="0" y="70" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Modems &amp; Wireless Controllers</text>
    <text x="0" y="86" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Broadband Gateway • Central Mesh</text>
  </g>

  <!-- Spec Tag -->
  <rect x="20" y="20" width="135" height="24" rx="12" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="87" y="36" fill="#1D5BD8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">MODEMS &amp; WI-FI</text>
</svg>
