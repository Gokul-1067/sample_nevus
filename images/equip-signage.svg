<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="eqSignLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="signScreenLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#eqSignLight)" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Left: Commercial High-Brightness Display -->
  <g transform="translate(170, 160)">
    <rect x="-90" y="-60" width="180" height="110" rx="6" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.8"/>
    <rect x="-84" y="-54" width="168" height="98" rx="3" fill="url(#signScreenLight)"/>
    
    <!-- Signage graphics -->
    <rect x="-76" y="-45" width="70" height="16" rx="2" fill="#FFFFFF" stroke="#93C5FD"/>
    <text x="-41" y="-33" fill="#1D5BD8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" text-anchor="middle">CAMPUS INFO</text>
    
    <rect x="-76" y="-20" width="152" height="32" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="-68" y="-4" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">SCHEDULE &amp; EVENTS</text>
    
    <!-- Signage player stick -->
    <rect x="-30" y="52" width="60" height="14" rx="2" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="0" y="62" fill="#1D5BD8" font-family="monospace" font-size="7" font-weight="700" text-anchor="middle">MEDIA STICK</text>

    <text x="0" y="85" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Commercial Display Panel</text>
    <text x="0" y="99" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">16/7 &amp; 24/7 Continuous Duty</text>
  </g>

  <!-- Right: Public Address Speaker & Conference Mic -->
  <g transform="translate(370, 160)">
    <!-- Column Speaker -->
    <rect x="-50" y="-80" width="40" height="130" rx="6" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.8"/>
    <circle cx="-30" cy="-55" r="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <circle cx="-30" cy="-25" r="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <circle cx="-30" cy="5" r="10" fill="#F1F5F9" stroke="#CBD5E1"/>
    <circle cx="-30" cy="30" r="6" fill="#EFF6FF" stroke="#1D5BD8"/>
    
    <!-- Gooseneck Mic / Console -->
    <g transform="translate(30, 20)">
      <rect x="-25" y="0" width="50" height="25" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
      <path d="M0 0 C-10 -30, 15 -60, 5 -80" stroke="#64748B" stroke-width="4" stroke-linecap="round" fill="none"/>
      <rect x="0" y="-88" width="10" height="16" rx="3" fill="#1D5BD8"/>
      <circle cx="5" cy="-80" r="2" fill="#EF4444"/>
    </g>

    <text x="0" y="85" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Audio &amp; PA Hardware</text>
    <text x="0" y="99" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Multi-Zone Sound &amp; Consoles</text>
  </g>

  <!-- Spec Tag -->
  <rect x="20" y="20" width="140" height="24" rx="12" fill="#EFF6FF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="90" y="36" fill="#1D5BD8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">AUDIO &amp; SIGNAGE</text>
</svg>
