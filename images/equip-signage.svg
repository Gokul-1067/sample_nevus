<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <linearGradient id="eqSign" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B33"/>
      <stop offset="100%" stop-color="#060C18"/>
    </linearGradient>
    <linearGradient id="signScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#eqSign)"/>

  <!-- Left: Commercial High-Brightness Display -->
  <g transform="translate(170, 160)">
    <rect x="-90" y="-60" width="180" height="110" rx="6" fill="#040814" stroke="#00E5BE" stroke-width="1.8"/>
    <rect x="-84" y="-54" width="168" height="98" rx="3" fill="url(#signScreen)"/>
    
    <!-- Signage graphics -->
    <rect x="-76" y="-45" width="70" height="16" rx="2" fill="#FFFFFF" fill-opacity="0.3"/>
    <text x="-72" y="-33" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">CAMPUS INFO</text>
    
    <rect x="-76" y="-20" width="152" height="32" rx="3" fill="#0B132B" fill-opacity="0.6"/>
    <text x="-68" y="-4" fill="#00E5BE" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">SCHEDULE &amp; EVENTS</text>
    
    <!-- Signage player stick -->
    <rect x="-30" y="52" width="60" height="14" rx="2" fill="#13233D" stroke="#1E3A6B"/>
    <text x="0" y="62" fill="#388BFD" font-family="monospace" font-size="7" text-anchor="middle">MEDIA STICK</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Commercial Display Panel</text>
    <text x="0" y="99" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">16/7 &amp; 24/7 Continuous Duty</text>
  </g>

  <!-- Right: Public Address Speaker & Conference Mic -->
  <g transform="translate(370, 160)">
    <!-- Column Speaker -->
    <rect x="-50" y="-80" width="40" height="130" rx="6" fill="#0C172B" stroke="#388BFD" stroke-width="1.8"/>
    <circle cx="-30" cy="-55" r="10" fill="#1E293B" stroke="#64748B"/>
    <circle cx="-30" cy="-25" r="10" fill="#1E293B" stroke="#64748B"/>
    <circle cx="-30" cy="5" r="10" fill="#1E293B" stroke="#64748B"/>
    <circle cx="-30" cy="30" r="6" fill="#1E293B" stroke="#00E5BE"/>
    
    <!-- Gooseneck Mic / Console -->
    <g transform="translate(30, 20)">
      <rect x="-25" y="0" width="50" height="25" rx="4" fill="#1E293B" stroke="#00E5BE"/>
      <path d="M0 0 C-10 -30, 15 -60, 5 -80" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" fill="none"/>
      <rect x="0" y="-88" width="10" height="16" rx="3" fill="#388BFD"/>
      <circle cx="5" cy="-80" r="2" fill="#EF4444"/>
    </g>

    <text x="0" y="85" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Audio &amp; PA Hardware</text>
    <text x="0" y="99" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">Multi-Zone Sound &amp; Consoles</text>
  </g>

  <!-- Spec Tag -->
  <rect x="20" y="20" width="140" height="24" rx="12" fill="#065F46" fill-opacity="0.4" stroke="#00E5BE" stroke-width="1"/>
  <text x="90" y="36" fill="#6EE7B7" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">AUDIO &amp; SIGNAGE</text>
</svg>

