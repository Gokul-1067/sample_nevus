<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B33"/>
      <stop offset="100%" stop-color="#070E1A"/>
    </linearGradient>
    <linearGradient id="scanLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5BE" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00E5BE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E5BE" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bioBg)"/>

  <!-- Left: Biometric Terminal / Wall Access Device -->
  <g transform="translate(180, 180)">
    <!-- Terminal Body -->
    <rect x="-85" y="-120" width="170" height="230" rx="14" fill="#0C172B" stroke="#00E5BE" stroke-width="1.8"/>
    <!-- Top Face-Recognition Camera Sensor array -->
    <rect x="-70" y="-108" width="140" height="32" rx="6" fill="#050C17" stroke="#1E3258"/>
    <circle cx="-35" cy="-92" r="6" fill="#1E293B" stroke="#388BFD"/>
    <circle cx="-35" cy="-92" r="2.5" fill="#388BFD"/>
    <circle cx="0" cy="-92" r="8" fill="#1E293B" stroke="#00E5BE"/>
    <circle cx="0" cy="-92" r="3" fill="#00E5BE"/>
    <circle cx="35" cy="-92" r="4" fill="#EF4444"/>
    <text x="0" y="-72" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" text-anchor="middle">AI DUAL LENS + IR</text>

    <!-- Interactive Color TFT Screen -->
    <rect x="-65" y="-62" width="130" height="85" rx="6" fill="#040912" stroke="#1E3A6B"/>
    <!-- Face Recognition Target Mesh -->
    <rect x="-24" y="-52" width="48" height="48" rx="8" fill="none" stroke="#00E5BE" stroke-width="1.5" stroke-dasharray="4 2"/>
    <circle cx="-12" cy="-35" r="2" fill="#00E5BE"/>
    <circle cx="12" cy="-35" r="2" fill="#00E5BE"/>
    <path d="M-8 -20 Q0 -16 8 -20" stroke="#00E5BE" stroke-width="1.2" fill="none"/>
    <text x="0" y="8" fill="#00E5BE" font-family="monospace" font-size="8.5" text-anchor="middle">VERIFIED: ACCESS GRANTED</text>
    <text x="0" y="18" fill="#94A3B8" font-family="monospace" font-size="7" text-anchor="middle">ID: 80429 • 09:02:14 AM</text>

    <!-- Fingerprint Optical Prism Glass -->
    <rect x="-35" y="38" width="70" height="60" rx="8" fill="#061224" stroke="#00E5BE" stroke-width="1.5"/>
    <g stroke="#00E5BE" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M-20 68 A20 20 0 0 1 20 68"/>
      <path d="M-14 74 A14 14 0 0 1 14 74"/>
      <path d="M-8 80 A8 8 0 0 1 8 80"/>
      <path d="M-2 84 A2 2 0 0 1 2 84"/>
    </g>
    <!-- Scanning beam line -->
    <line x1="-30" y1="62" x2="30" y2="62" stroke="url(#scanLaser)" stroke-width="2"/>
  </g>

  <!-- Right: Automated Access Controller & Turnstile / Magnetic Lock -->
  <g transform="translate(430, 180)">
    <!-- Access Controller Unit -->
    <rect x="-90" y="-110" width="180" height="110" rx="8" fill="#0D182E" stroke="#388BFD" stroke-width="1.5"/>
    <rect x="-80" y="-98" width="160" height="24" rx="4" fill="#060C17"/>
    <text x="-70" y="-82" fill="#388BFD" font-family="monospace" font-size="8.5">CONTROLLER // 4-DOOR</text>
    <circle cx="65" cy="-86" r="3" fill="#00E5BE"/>
    
    <!-- Relay indicators -->
    <g fill="#102340">
      <rect x="-78" y="-64" width="70" height="22" rx="3" stroke="#1E3A6B"/>
      <text x="-43" y="-50" fill="#00E5BE" font-family="monospace" font-size="7.5" text-anchor="middle">RELAY 1: UNLOCKED</text>
      <rect x="8" y="-64" width="70" height="22" rx="3" stroke="#1E3A6B"/>
      <text x="43" y="-50" fill="#94A3B8" font-family="monospace" font-size="7.5" text-anchor="middle">RELAY 2: SECURED</text>
      <rect x="-78" y="-36" width="70" height="22" rx="3" stroke="#1E3A6B"/>
      <text x="-43" y="-22" fill="#94A3B8" font-family="monospace" font-size="7.5" text-anchor="middle">RELAY 3: SECURED</text>
      <rect x="8" y="-36" width="70" height="22" rx="3" stroke="#1E3A6B"/>
      <text x="43" y="-22" fill="#94A3B8" font-family="monospace" font-size="7.5" text-anchor="middle">RELAY 4: SECURED</text>
    </g>

    <!-- Magnetic EM-Lock Visual -->
    <g transform="translate(0, 45)">
      <rect x="-70" y="-15" width="140" height="30" rx="4" fill="#1E293B" stroke="#64748B"/>
      <rect x="-55" y="-5" width="110" height="12" fill="#0F172A"/>
      <!-- Armature Plate -->
      <rect x="-60" y="20" width="120" height="16" rx="3" fill="#334155" stroke="#94A3B8"/>
      <!-- Magnetic Field Lines -->
      <path d="M-40 8 L-40 19 M0 8 L0 19 M40 8 L40 19" stroke="#00E5BE" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="52" fill="#00E5BE" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">FAIL-SAFE EM LOCK 600 LBS</text>
    </g>
  </g>

  <!-- Wire Connection -->
  <path d="M265 180 C310 180, 310 125, 340 125" stroke="#00E5BE" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Footer Banner -->
  <rect x="30" y="340" width="540" height="38" rx="8" fill="#11223F" stroke="#1E3A66"/>
  <text x="45" y="364" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Biometric Access &amp; Attendance Systems</text>
  <text x="555" y="364" fill="#00E5BE" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="end">Facial Terminals • Fingerprint Sensors • Access Controllers</text>
</svg>

