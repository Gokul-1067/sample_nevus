<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="cctvBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="cctvBeamLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D5BD8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1D5BD8" stop-opacity="0.01"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#cctvBgLight)" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <!-- Subtle coordinate grid -->
  <g stroke="#CBD5E1" stroke-width="0.8" opacity="0.45">
    <path d="M50 0v400 M150 0v400 M250 0v400 M350 0v400 M450 0v400 M550 0v400"/>
    <path d="M0 80h600 M0 160h600 M0 240h600 M0 320h600"/>
  </g>

  <!-- Left: Industrial Bullet & Dome Cameras -->
  <g transform="translate(130, 160)">
    <!-- Mounting Bracket -->
    <path d="M-60 -30 L-20 -30 L-20 0" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
    <rect x="-70" y="-45" width="16" height="30" rx="3" fill="#94A3B8"/>
    
    <!-- Bullet Body -->
    <rect x="-25" y="-18" width="80" height="36" rx="6" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.5"/>
    <path d="M55 -14 L75 -24 L75 24 L55 14 Z" fill="#1E293B" stroke="#1D5BD8" stroke-width="1.5"/>
    <!-- Optical Lens & Sensor -->
    <ellipse cx="75" cy="0" rx="4" ry="24" fill="#1D5BD8" opacity="0.4"/>
    <circle cx="75" cy="0" r="8" fill="#0F172A" stroke="#1D5BD8" stroke-width="1.5"/>
    <circle cx="75" cy="0" r="3" fill="#38BDF8"/>
    
    <!-- Infrared LEDs -->
    <circle cx="68" cy="-12" r="2" fill="#EF4444"/>
    <circle cx="68" cy="12" r="2" fill="#EF4444"/>

    <!-- Surveillance Vision Cone -->
    <path d="M78 0 L320 -110 L320 110 Z" fill="url(#cctvBeamLight)"/>
    
    <!-- Status LED -->
    <circle cx="-10" cy="-24" r="3" fill="#059669"/>
    <text x="-5" y="-21" fill="#1D5BD8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700">IP-STREAM REC</text>
  </g>

  <!-- Right: Surveillance Monitoring Wall / NVR Deck -->
  <g transform="translate(420, 190)">
    <!-- Large Console Monitor -->
    <rect x="-110" y="-110" width="220" height="140" rx="8" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="2"/>
    <rect x="-102" y="-102" width="204" height="124" rx="4" fill="#F8FAFC"/>
    
    <!-- 4-Split Camera Matrix Screen -->
    <!-- Cam 1 -->
    <rect x="-98" y="-98" width="96" height="58" rx="2" fill="#EFF6FF" stroke="#CBD5E1"/>
    <text x="-90" y="-84" fill="#1D5BD8" font-family="monospace" font-size="8" font-weight="700">CAM 01 // MAIN GATE</text>
    <circle cx="-50" cy="-69" r="8" fill="none" stroke="#1D5BD8" stroke-dasharray="2 2"/>
    
    <!-- Cam 2 -->
    <rect x="2" y="-98" width="96" height="58" rx="2" fill="#EFF6FF" stroke="#CBD5E1"/>
    <text x="10" y="-84" fill="#1D5BD8" font-family="monospace" font-size="8" font-weight="700">CAM 02 // SERVER ROOM</text>
    <rect x="35" y="-80" width="30" height="26" fill="#CBD5E1"/>

    <!-- Cam 3 -->
    <rect x="-98" y="-36" width="96" height="58" rx="2" fill="#EFF6FF" stroke="#CBD5E1"/>
    <text x="-90" y="-22" fill="#1D5BD8" font-family="monospace" font-size="8" font-weight="700">CAM 03 // PERIMETER</text>
    
    <!-- Cam 4 -->
    <rect x="2" y="-36" width="96" height="58" rx="2" fill="#EFF6FF" stroke="#CBD5E1"/>
    <text x="10" y="-22" fill="#1D5BD8" font-family="monospace" font-size="8" font-weight="700">CAM 04 // ENTRY LOBBY</text>
    
    <!-- Monitor Stand -->
    <path d="M-15 30 L-25 50 L25 50 L15 30 Z" fill="#94A3B8"/>
    <rect x="-40" y="50" width="80" height="6" rx="3" fill="#64748B"/>

    <!-- NVR Unit Below -->
    <rect x="-100" y="66" width="200" height="34" rx="5" fill="#FFFFFF" stroke="#1D5BD8" stroke-width="1.2"/>
    <circle cx="-80" cy="83" r="3" fill="#059669"/>
    <circle cx="-70" cy="83" r="3" fill="#1D5BD8"/>
    <!-- Hard Drive Bays -->
    <rect x="-40" y="73" width="16" height="20" rx="2" fill="#F1F5F9" stroke="#CBD5E1"/>
    <rect x="-18" y="73" width="16" height="20" rx="2" fill="#F1F5F9" stroke="#CBD5E1"/>
    <rect x="4" y="73" width="16" height="20" rx="2" fill="#F1F5F9" stroke="#CBD5E1"/>
    <rect x="26" y="73" width="16" height="20" rx="2" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="65" y="86" fill="#475569" font-family="monospace" font-size="8.5" font-weight="700">NVR 32CH</text>
  </g>

  <!-- Data Flow Wire -->
  <path d="M185 160 C260 160, 280 256, 320 256" stroke="#1D5BD8" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="260" cy="208" r="3" fill="#1D5BD8"/>

  <!-- Integration Footer Badge -->
  <rect x="30" y="340" width="540" height="38" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="45" y="364" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">CCTV &amp; Video Surveillance Integration</text>
  <text x="555" y="364" fill="#1D5BD8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="end">IP Dome &amp; Bullet • Multi-Channel NVR • Live Matrix</text>
</svg>
