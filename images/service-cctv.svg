<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="cctvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1B33"/>
      <stop offset="100%" stop-color="#070E1A"/>
    </linearGradient>
    <linearGradient id="cctvBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5BE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0062FF" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#cctvBg)"/>
  
  <!-- Subtle coordinate grid -->
  <g stroke="#1E3258" stroke-width="0.8" opacity="0.3">
    <path d="M50 0v400 M150 0v400 M250 0v400 M350 0v400 M450 0v400 M550 0v400"/>
    <path d="M0 80h600 M0 160h600 M0 240h600 M0 320h600"/>
  </g>

  <!-- Left: Industrial Bullet & Dome Cameras -->
  <g transform="translate(130, 160)">
    <!-- Mounting Bracket -->
    <path d="M-60 -30 L-20 -30 L-20 0" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <rect x="-70" y="-45" width="16" height="30" rx="3" fill="#334155"/>
    
    <!-- Bullet Body -->
    <rect x="-25" y="-18" width="80" height="36" rx="6" fill="#1E293B" stroke="#00E5BE" stroke-width="1.5"/>
    <path d="M55 -14 L75 -24 L75 24 L55 14 Z" fill="#0F172A" stroke="#00E5BE" stroke-width="1.5"/>
    <!-- Optical Lens & Sensor -->
    <ellipse cx="75" cy="0" rx="4" ry="24" fill="#00E5BE" opacity="0.4"/>
    <circle cx="75" cy="0" r="8" fill="#0B1528" stroke="#00E5BE" stroke-width="1.5"/>
    <circle cx="75" cy="0" r="3" fill="#00E5BE"/>
    
    <!-- Infrared LEDs -->
    <circle cx="68" cy="-12" r="2" fill="#EF4444"/>
    <circle cx="68" cy="12" r="2" fill="#EF4444"/>

    <!-- Surveillance Vision Cone -->
    <path d="M78 0 L320 -110 L320 110 Z" fill="url(#cctvBeam)"/>
    
    <!-- Status LED -->
    <circle cx="-10" cy="-24" r="3" fill="#00E5BE"/>
    <text x="-5" y="-21" fill="#00E5BE" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">IP-STREAM REC</text>
  </g>

  <!-- Right: Surveillance Monitoring Wall / NVR Deck -->
  <g transform="translate(420, 190)">
    <!-- Large Console Monitor -->
    <rect x="-110" y="-110" width="220" height="140" rx="8" fill="#091322" stroke="#2563EB" stroke-width="2"/>
    <rect x="-102" y="-102" width="204" height="124" rx="4" fill="#050B14"/>
    
    <!-- 4-Split Camera Matrix Screen -->
    <!-- Cam 1 -->
    <rect x="-98" y="-98" width="96" height="58" rx="2" fill="#0D1D38" stroke="#1E3A6B"/>
    <text x="-90" y="-84" fill="#00E5BE" font-family="monospace" font-size="8">CAM 01 // MAIN GATE</text>
    <circle cx="-50" cy="-69" r="8" fill="none" stroke="#00E5BE" stroke-dasharray="2 2"/>
    
    <!-- Cam 2 -->
    <rect x="2" y="-98" width="96" height="58" rx="2" fill="#0D1D38" stroke="#1E3A6B"/>
    <text x="10" y="-84" fill="#00E5BE" font-family="monospace" font-size="8">CAM 02 // SERVER ROOM</text>
    <rect x="35" y="-80" width="30" height="26" fill="#1E293B"/>

    <!-- Cam 3 -->
    <rect x="-98" y="-36" width="96" height="58" rx="2" fill="#0D1D38" stroke="#1E3A6B"/>
    <text x="-90" y="-22" fill="#00E5BE" font-family="monospace" font-size="8">CAM 03 // PERIMETER</text>
    
    <!-- Cam 4 -->
    <rect x="2" y="-36" width="96" height="58" rx="2" fill="#0D1D38" stroke="#1E3A6B"/>
    <text x="10" y="-22" fill="#00E5BE" font-family="monospace" font-size="8">CAM 04 // ENTRY LOBBY</text>
    
    <!-- Monitor Stand -->
    <path d="M-15 30 L-25 50 L25 50 L15 30 Z" fill="#1E293B"/>
    <rect x="-40" y="50" width="80" height="6" rx="3" fill="#334155"/>

    <!-- NVR Unit Below -->
    <rect x="-100" y="66" width="200" height="34" rx="5" fill="#111F38" stroke="#388BFD" stroke-width="1.2"/>
    <circle cx="-80" cy="83" r="3" fill="#00E5BE"/>
    <circle cx="-70" cy="83" r="3" fill="#388BFD"/>
    <!-- Hard Drive Bays -->
    <rect x="-40" y="73" width="16" height="20" rx="2" fill="#091322"/>
    <rect x="-18" y="73" width="16" height="20" rx="2" fill="#091322"/>
    <rect x="4" y="73" width="16" height="20" rx="2" fill="#091322"/>
    <rect x="26" y="73" width="16" height="20" rx="2" fill="#091322"/>
    <text x="65" y="86" fill="#94A3B8" font-family="monospace" font-size="8.5">NVR 32CH</text>
  </g>

  <!-- Data Flow Wire -->
  <path d="M185 160 C260 160, 280 256, 320 256" stroke="#00E5BE" stroke-width="1.8" stroke-dasharray="4 4"/>
  <circle cx="260" cy="208" r="3" fill="#00E5BE"/>

  <!-- Integration Footer Badge -->
  <rect x="30" y="340" width="540" height="38" rx="8" fill="#11223F" stroke="#1E3A66"/>
  <text x="45" y="364" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">CCTV &amp; Video Surveillance Integration</text>
  <text x="555" y="364" fill="#00E5BE" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="end">IP Dome &amp; Bullet • Multi-Channel NVR • Live Matrix</text>
</svg>

